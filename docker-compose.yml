version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: estateflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estateflow
      POSTGRES_USER: estateflow
      POSTGRES_PASSWORD: estateflow_dev
    ports:
      - "5432:5432"
    volumes:
      - estateflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  estateflow_pgdata:
